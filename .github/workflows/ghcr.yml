name: GHCR

on:
  push:
    branches: [main, production]
    tags: ["v*.*.*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: tags
        run: |
          img=ghcr.io/skylab-kulubu/skylab-site
          sha='${{ github.sha }}'
          ref='${{ github.ref_name }}'
          if [ "$ref" = production ]; then
            echo "list=${img}:production,${img}:${sha}" >> "$GITHUB_OUTPUT"
          elif [ "$ref" = main ]; then
            echo "list=${img}:latest,${img}:sandbox,${img}:${sha}" >> "$GITHUB_OUTPUT"
          else
            echo "list=${img}:${sha}" >> "$GITHUB_OUTPUT"
          fi
      - id: environment
        run: |
          ref='${{ github.ref_name }}'
          if [ "$ref" = production ] || [[ "$ref" == v* ]]; then
            echo "api_url=https://api.yildizskylab.com" >> "$GITHUB_OUTPUT"
            echo "cms_url=https://api.yildizskylab.com/api" >> "$GITHUB_OUTPUT"
            echo "cms_cdn_url=https://api.yildizskylab.com/api/media" >> "$GITHUB_OUTPUT"
            echo "forms_url=https://forms.yildizskylab.com" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://sandbox-api.yildizskylab.com" >> "$GITHUB_OUTPUT"
            echo "cms_url=https://sandbox-api.yildizskylab.com/api" >> "$GITHUB_OUTPUT"
            echo "cms_cdn_url=https://sandbox-api.yildizskylab.com/api/media" >> "$GITHUB_OUTPUT"
            echo "forms_url=https://sandbox-forms.yildizskylab.com" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            API_BASE_URL=${{ steps.environment.outputs.api_url }}
            CMS_URL=${{ steps.environment.outputs.cms_url }}
            CMS_CDN_URL=${{ steps.environment.outputs.cms_cdn_url }}
            NEXT_PUBLIC_FORMS_URL=${{ steps.environment.outputs.forms_url }}
      - name: Notify Dokploy
        if: github.ref == 'refs/heads/production'
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DOKPLOY_DEPLOY_HOOK unset; skip"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
