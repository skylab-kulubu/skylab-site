version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # ADR 0055 / ADR 0064: @skylab-kulubu/* packages (skylcn-ui) come weekly
    # in one grouped PR; other dependencies keep their own PRs as before.
    groups:
      skylab-kulubu:
        patterns:
          - "@skylab-kulubu/*"
      # react and react-dom must move together (react 19.3 with react-dom
      # 19.2 is a version mismatch), so the React family gets one PR.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
